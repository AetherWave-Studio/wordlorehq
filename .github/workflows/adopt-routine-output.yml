# The weekly routine cannot push to master: its session writes to an outcome
# branch. Between 2026-07-06 and 2026-09-05 that meant every run started from a
# master that had never received the previous run's work - including the
# refilled word queue - so the "queue low" stop condition fired every Saturday
# and the channel produced nothing for nine weeks while the routine reported
# success.
#
# This closes the loop from the repo side: a routine branch is validated and
# then merged into master, so nobody has to remember.
#
# ⚠️ DO NOT narrow this to a branch-name prefix. The first version matched
# `claude/intelligent-franklin*`, the outcome branch named in the routine's
# config - but every run gets a FRESH session-generated name
# (`claude/festive-johnson-17ylue` on 2026-09-06), so the pattern matched
# nothing and the very first real run stranded exactly like the nine before it.
# What identifies routine output is not its name, it is what it touches.
#
# Two guards decide instead:
#   1. An open PR on the branch means a human wants review. Skip it.
#   2. The diff must touch ONLY content paths. Episodes, renders and the
#      candidate bank land automatically; anything touching code, config or
#      this workflow goes through a pull request like any other change.

name: Adopt routine output

on:
  push:
    branches:
      - 'claude/**'

concurrency:
  group: adopt-routine-output
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this is routine output
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -n "$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[].number')" ]; then
            echo "Branch has an open PR - leaving it for review."
            echo "adopt=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin master
          changed=$(git diff --name-only origin/master..."$GITHUB_SHA")
          echo "Changed files:"; echo "$changed"

          # Content the routine is allowed to land unattended.
          outside=$(echo "$changed" | grep -Ev \
            '^(src/lib/wordlore-content/|public/episodes/|public/trailers/|\.wordlore-context/word-candidates\.md$)' \
            || true)

          if [ -n "$outside" ]; then
            echo "Touches non-content paths, so it needs review:"; echo "$outside"
            echo "adopt=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "adopt=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.adopt == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.adopt == 'true'

      - name: Typecheck, lint, build
        if: steps.gate.outputs.adopt == 'true'
        run: |
          npx tsc --noEmit
          npm run lint
          npm run build

      - name: Merge into master
        if: steps.gate.outputs.adopt == 'true'
        run: |
          set -euo pipefail
          git config user.name  "wordlore-routine[bot]"
          git config user.email "wordlore-routine[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B master origin/master

          # A conflict means the routine and master edited the same registry.
          # Fail rather than resolve it blind - state.json and
          # word-pipeline.json are bookkeeping, and a bad automatic resolution
          # loses a week's work.
          if ! git merge --no-ff "$GITHUB_SHA" -m "Merge routine output ${GITHUB_REF_NAME} into master"; then
            git merge --abort
            echo "::error::Routine branch ${GITHUB_REF_NAME} conflicts with master. Resolve by hand; the branch is untouched."
            exit 1
          fi

          git push origin master
          echo "Merged ${GITHUB_REF_NAME} into master."
